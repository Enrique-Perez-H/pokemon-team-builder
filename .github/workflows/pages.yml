# Typechecks, runs the unit and browser tests, builds, and publishes the app to GitHub Pages on every push to main.
# Pull requests run the same checks without deploying.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - run: npm run build
      - name: Install the browser for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop and phone)
        run: npx playwright test
      - name: Keep the Playwright report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
